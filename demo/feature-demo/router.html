<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>std-ui — router features demo</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="../material-theme.css" />
	<link rel="stylesheet" href="../demo-components.css" />
	<style>
		.demo-main { max-width: none; width: 90%; box-sizing: border-box; }
		.rt-page { border: 1px solid var(--md-sys-color-outline-variant, #cac4d0); border-radius: 12px; padding: 1rem; }
		.rt-page h2 { margin: 0 0 0.5rem; }
	</style>
	<script>
		// The full demo below uses real URLs under /feature-demo/router/; move off the .html address first.
		if (location.pathname.endsWith('/feature-demo/router.html')) {
			history.replaceState(null, '', location.pathname.replace(/router\.html$/, 'router/') + location.search + location.hash);
		}
	</script>
</head>
<body>
	<header class="demo-app-bar">
		<h1><code>router</code> features</h1>
		<p class="lead">
			Accessibility and polish options of <code>@std-ui/router</code>. The first demo is the full router with real URLs,
			guards and loaders (dev server only); the others use an in-memory Navigation API, so the address bar does not change.
		</p>
	</header>
	<demo-nav>
		<a href="#full-router">Full router</a>
		<a href="#announcer">Announcer</a>
		<a href="#view-transition">View transitions</a>
	</demo-nav>
	<main class="demo-main">
		<demo-router-page></demo-router-page>
	</main>

	<script type="module" src="./router-main.ts"></script>
</body>
</html>
